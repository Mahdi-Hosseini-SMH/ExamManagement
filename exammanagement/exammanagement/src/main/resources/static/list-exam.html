<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>لیست آزمون‌ها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-out;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            transition: transform 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.3);
        }

        .actions button {
            margin-left: 10px;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #ff4757;
            color: #fff;
        }

        .actions button.edit {
            background: #2ed573;
        }

        .actions button:hover {
            opacity: 0.8;
        }

        form {
            margin-top: 20px;
        }

        form input {
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: calc(100% - 120px);
        }

        form button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #1e90ff;
            color: #fff;
            cursor: pointer;
        }

        form button:hover {
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>آزمون‌های دوره</h1>
    <h2 id="courseTitle"></h2> <!-- عنوان دوره اینجا نمایش داده می‌شود -->
    <ul id="examsList"></ul> <!-- لیست آزمون‌ها اینجا نمایش داده می‌شود -->

    <!-- فرم ایجاد آزمون جدید -->
    <form id="createExamForm">
        <input type="text" id="examTitle" placeholder="عنوان آزمون جدید" required>
        <button type="submit">ایجاد آزمون</button>
    </form>
</div>

<script>
    // دریافت شناسه دوره از URL
    const urlParams = new URLSearchParams(window.location.search);
    let courseId = urlParams.get('courseId');

    // حذف کاراکترهای اضافی مانند '/' از انتهای courseId
    if (courseId && courseId.endsWith('/')) {
        courseId = courseId.slice(0, -1); // حذف '/' از انتها
    }
    console.log('Course ID from URL:', courseId); // بررسی مقدار courseId

    // تابع برای دریافت عنوان دوره
    function fetchCourseTitle(courseId) {
        if (!courseId) {
            console.error('شناسه دوره نامعتبر است');
            return;
        }

        fetch(`http://localhost:8080/course/${courseId}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`خطا در دریافت عنوان دوره: ${response.status} ${response.statusText}`);
                }
                return response.json();
            })
            .then(course => {
                document.getElementById('courseTitle').textContent = course.title; // نمایش عنوان دوره
            })
            .catch(error => {
                console.error('خطا در دریافت عنوان دوره:', error);
                alert('خطا در دریافت عنوان دوره: ' + error.message);
            });
    }

    // تابع برای دریافت لیست آزمون‌ها
    function fetchExams(courseId) {
        if (!courseId) {
            console.error('شناسه دوره نامعتبر است');
            return;
        }

        fetch(`http://localhost:8080/exam/all/${courseId}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`خطا در دریافت آزمون‌ها: ${response.status} ${response.statusText}`);
                }
                return response.json();
            })
            .then(exams => {
                const examsList = document.getElementById('examsList');
                examsList.innerHTML = ''; // پاک کردن لیست قبلی
                exams.forEach(exam => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>${exam.title}</span>
                        <span>${exam.description}</span>
                        <div class="actions">
                            <button class="edit" onclick="editExam('${exam.id}')">ویرایش</button>

                            <button onclick="deleteExam('${exam.id}')">حذف</button>
                        </div>
                    `;
                    examsList.appendChild(li);
                });
            })
            .catch(error => {
                console.error('خطا در دریافت آزمون‌ها:', error);
                alert('خطا در دریافت آزمون‌ها: ' + error.message);
            });
    }

    // تابع برای ایجاد آزمون جدید
    document.getElementById('createExamForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const examTitle = document.getElementById('examTitle').value;

        if (!courseId) {
            alert('شناسه دوره نامعتبر است');
            return;
        }

        fetch(`http://localhost:8080/exam/create-exam/${courseId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ title: examTitle })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('خطا در ایجاد آزمون');
                }
                return response.json();
            })
            .then(() => {
                alert('آزمون با موفقیت ایجاد شد.');
                fetchExams(courseId); // بارگذاری مجدد لیست آزمون‌ها
            })
            .catch(error => {
                console.error('خطا در ایجاد آزمون:', error);
                alert('خطا در ایجاد آزمون: ' + error.message);
            });
    });

    // تابع برای ویرایش آزمون
    function editExam(examId) {
        if (!examId) {
            console.error('شناسه آزمون نامعتبر است');
            return;
        }

        const newTitle = prompt('عنوان جدید را وارد کنید:');
        if (newTitle) {
            fetch(`http://localhost:8080/exam/update/${examId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title: newTitle })
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('خطا در ویرایش آزمون');
                    }
                    return response.text();
                })
                .then(() => {
                    alert('آزمون با موفقیت ویرایش شد.');
                    fetchExams(courseId); // بارگذاری مجدد لیست آزمون‌ها
                })
                .catch(error => {
                    console.error('خطا در ویرایش آزمون:', error);
                    alert('خطا در ویرایش آزمون: ' + error.message);
                });
        }
    }

    // تابع برای حذف آزمون
    function deleteExam(examId) {
        if (!examId) {
            console.error('شناسه آزمون نامعتبر است');
            return;
        }

        if (confirm('آیا مطمئن هستید که می‌خواهید این آزمون را حذف کنید؟')) {
            fetch(`http://localhost:8080/exam/delete/${examId}`, {
                method: 'DELETE'
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('خطا در حذف آزمون');
                    }
                    return response.text();
                })
                .then(() => {
                    alert('آزمون با موفقیت حذف شد.');
                    fetchExams(courseId); // بارگذاری مجدد لیست آزمون‌ها
                })
                .catch(error => {
                    console.error('خطا در حذف آزمون:', error);
                    alert('خطا در حذف آزمون: ' + error.message);
                });
        }
    }

    // بارگذاری اطلاعات دوره و آزمون‌ها هنگام بارگذاری صفحه
    window.onload = function () {
        if (!courseId) {
            alert('شناسه دوره نامعتبر است');
            return;
        }
        fetchCourseTitle(courseId); // دریافت و نمایش عنوان دوره
        fetchExams(courseId); // دریافت و نمایش لیست آزمون‌ها
    };
</script>
</body>
</html>
