
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاربران</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #333;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }


        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-form input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .search-form input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-form button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #2575fc;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-form button:hover {
            background-color: #1a5bbf;
            transform: translateY(-2px);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .table th, .table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .table th {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .table tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .table button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .table button.edit-btn {
            background-color: #ffc107;
            color: #000;
        }

        .table button.edit-btn:hover {
            background-color: #e0a800;
            transform: translateY(-2px);
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .modal-header, .modal-footer {
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .modal-title {
            color: #fff;
        }

        .modal-body input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .modal-body input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .modal-footer button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-footer button.close-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .modal-footer button.close-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .modal-footer button.save-btn {
            background-color: #2575fc;
            color: #fff;
        }

        .modal-footer button.save-btn:hover {
            background-color: #1a5bbf;
            transform: translateY(-2px);
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>مدیریت کاربران</h2>
    <div class="search-form">
        <input type="text" id="nationalCode" placeholder="کد ملی">
        <input type="text" id="firstName" placeholder="نام">
        <input type="text" id="lastName" placeholder="نام خانوادگی">
        <input type="text" id="role" placeholder="نقش">
        <button onclick="filterUsers()">جستجو</button>
    </div>
    <table class="table">
        <thead>
        <tr>
            <th>عملیات</th>
            <th>کد ملی</th>
            <th>نام</th>
            <th>نام خانوادگی</th>
            <th>نقش</th>
        </tr>
        </thead>
        <tbody id="userTableBody">
        </tbody>
    </table>

    <div id="editUserModal" class="modal fade" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">ویرایش کاربر</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editUserId">
                    <div class="mb-3">
                        <label for="editNationalCode" class="form-label">کد ملی</label>
                        <input type="text" id="editNationalCode" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="editFirstName" class="form-label">نام</label>
                        <input type="text" id="editFirstName" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="editLastName" class="form-label">نام خانوادگی</label>
                        <input type="text" id="editLastName" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="editRole" class="form-label">نقش</label>
                        <input type="text" id="editRole" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn close-btn" data-bs-dismiss="modal">بستن</button>
                    <button type="button" class="btn save-btn" onclick="updateUser()">ذخیره تغییرات</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadUsers() {
        try {
            const response = await fetch('http://localhost:8080/admin/approved-users');
            if (!response.ok) throw new Error('خطا در بارگذاری کاربران');
            const users = await response.json();
            const userTableBody = document.getElementById('userTableBody');
            userTableBody.innerHTML = '';
            users.forEach(user => {
                userTableBody.innerHTML += `<tr class="fade-in">
                        <td><button class="btn edit-btn" onclick="editUser('${user.nationalCode}')">ویرایش</button></td>
                        <td>${user.nationalCode}</td>
                        <td>${user.firstName}</td>
                        <td>${user.lastName}</td>
                        <td>${user.role}</td>
                    </tr>`;
            });
        } catch (error) {
            console.error('Error loading users:', error);
            alert('خطا در بارگذاری کاربران');
        }
    }

    async function editUser(nationalCode) {
        try {
            const response = await fetch(`http://localhost:8080/admin/find-users/${nationalCode}`);
            if (!response.ok) throw new Error('خطا در بارگذاری اطلاعات کاربر');
            const user = await response.json();
            document.getElementById('editNationalCode').value = user.nationalCode;
            document.getElementById('editFirstName').value = user.firstName;
            document.getElementById('editLastName').value = user.lastName;
            document.getElementById('editRole').value = user.role;

            const modal = new bootstrap.Modal(document.getElementById('editUserModal'));
            modal.show();
        } catch (error) {
            console.error('Error loading user data:', error);
            alert('خطا در بارگذاری اطلاعات کاربر');
        }
    }

    async function updateUser() {
        const nationalCode = document.getElementById('editNationalCode').value;
        const firstName = document.getElementById('editFirstName').value;
        const lastName = document.getElementById('editLastName').value;
        const role = document.getElementById('editRole').value;

        if (confirm("آیا واقعاً می‌خواهید این تغییرات را ذخیره کنید؟")) {
            try {
                const response = await fetch(`http://localhost:8080/admin/update/users/${nationalCode}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ firstName, lastName, role })
                });
                if (!response.ok) throw new Error('خطا در بروزرسانی کاربر');
                loadUsers();
                const modal = bootstrap.Modal.getInstance(document.getElementById('editUserModal'));
                modal.hide();
                alert("کاربر با موفقیت به‌روزرسانی شد!");
            } catch (error) {
                console.error('Error during update fetch:', error);
                alert("خطا در اتصال به سرور!");
            }
        }
    }

    async function filterUsers() {
        const nationalCode = document.getElementById('nationalCode').value;
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const role = document.getElementById('role').value;

        try {
            const response = await fetch(`http://localhost:8080/admin/users/filter?nationalCode=${nationalCode}&firstName=${firstName}&lastName=${lastName}&role=${role}`);
            if (!response.ok) throw new Error('خطا در فیلتر کردن کاربران');
            const users = await response.json();
            const userTableBody = document.getElementById('userTableBody');
            userTableBody.innerHTML = '';
            users.forEach(user => {
                userTableBody.innerHTML += `<tr class="fade-in">
                        <td><button class="btn edit-btn" onclick="editUser('${user.nationalCode}')">ویرایش</button></td>
                        <td>${user.nationalCode}</td>
                        <td>${user.firstName}</td>
                        <td>${user.lastName}</td>
                        <td>${user.role}</td>
                    </tr>`;
            });
        } catch (error) {
            console.error('Error filtering users:', error);
            alert('خطا در فیلتر کردن کاربران');
        }
    }

    loadUsers();
</script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.min.js"></script>
</body>
</html>
