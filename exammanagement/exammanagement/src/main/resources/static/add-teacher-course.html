
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اضافه کردن استاد به دوره</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #333;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease-out;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
            font-size: 16px;
        }

        select:focus, button:focus {
            border-color: #2575fc;
            outline: none;
            box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
        }

        button {
            background-color: #2575fc;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            border: 1px solid transparent;
        }

        button:hover {
            background-color: #1a5bbf;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            text-align: center;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>اضافه کردن استاد به دوره</h2>
    <select id="courseSelect" required>
        <option value="">لطفاً دوره را انتخاب کنید</option>
    </select>
    <select id="teacherSelect" required>
        <option value="">لطفاً استاد را انتخاب کنید</option>
    </select>
    <button onclick="addTeacherToCourse()">اضافه کردن استاد</button>
    <div id="message" class="message"></div>
</div>

<script>
    async function loadCourses() {
        try {
            const response = await fetch('http://localhost:8080/course/without-teacher');
            const courses = await response.json();
            const courseSelect = document.getElementById('courseSelect');

            if (courses.length === 0) {
                courseSelect.innerHTML = '<option value="">هیچ دوره‌ای برای بارگذاری وجود ندارد.</option>';
                return;
            }

            courses.forEach(course => {
                const option = document.createElement('option');
                option.value = course.identifier; // اطمینان حاصل کنید که این شناسه قابل قبول است
                option.textContent = `${course.title} (${course.startDate})`; // نمایش واضح‌تر
                courseSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading courses:', error);
            document.getElementById('message').innerText = 'خطا در بارگذاری دوره‌ها';
        }
    }

    async function loadTeachers() {
        try {
            const response = await fetch('http://localhost:8080/teacher/all');
            const teachers = await response.json();
            const teacherSelect = document.getElementById('teacherSelect');

            if (teachers.length === 0) {
                teacherSelect.innerHTML = '<option value="">هیچ استادی برای بارگذاری وجود ندارد.</option>';
                return;
            }

            teachers.forEach(teacher => {
                const option = document.createElement('option');
                option.value = teacher.nationalCode; // استفاده از nationalCode به‌جای UUID
                option.textContent = `${teacher.firstName} ${teacher.lastName} (${teacher.nationalCode})`;
                teacherSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading teachers:', error);
            document.getElementById('message').innerText = 'خطا در بارگذاری استادها';
        }
    }

    async function addTeacherToCourse() {
        const courseId = document.getElementById('courseSelect').value;
        const teacherId = document.getElementById('teacherSelect').value; // استفاده از nationalCode

        if (!courseId || !teacherId) {
            document.getElementById('message').innerText = 'لطفاً ابتدا دوره و استاد را انتخاب کنید.';
            return;
        }

        try {
            const response = await fetch(`http://localhost:8080/course/add-teacher/${courseId}/teachers/${teacherId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
            });

            if (!response.ok) {
                throw new Error('خطا در اضافه کردن استاد')
            }

            const result = await response.json();
            document.getElementById('message').innerText = 'استاد با موفقیت به دوره اضافه شد.';
        } catch (error) {
            console.error('Adding teacher to course failed:', error);
            document.getElementById('message').innerText = 'اضافه کردن استاد به دوره ناموفق بود.';
        }
    }

    window.onload = () => {
        loadCourses();
        loadTeachers();
    };
</script>

</body>
</html>
