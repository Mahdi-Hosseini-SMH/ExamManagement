<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>داشبورد استاد - دوره‌ها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-out;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            transition: transform 0.2s;
        }

        li:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.3);
        }

        a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>دوره‌های شما</h1>
    <ul id="coursesList"></ul>
</div>

<script>
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }

    const teacherId = getCookie('teacherId');

    if (!teacherId) {
        alert('لطفاً ابتدا وارد شوید');
        window.location.href = 'login-teacher.html';
    } else {
        fetch(`http://localhost:8080/teacher/courses/${teacherId}`)
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('خطا در دریافت دوره‌ها');
                }
            })
            .then(courses => {
                const coursesList = document.getElementById('coursesList');
                courses.forEach(course => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');

                    // تنظیم href برای لینک به صفحه آزمون‌ها با شناسه دوره
                    link.href = `list-exam.html?courseId=${course.id}/`;

                    link.textContent = course.title; // عنوان دوره
                    li.appendChild(link);
                    coursesList.appendChild(li);
                });
            })
            .catch(error => {
                alert(error.message);
            });
    }
</script>
</body>
</html>
