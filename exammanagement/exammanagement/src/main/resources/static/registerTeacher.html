<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت نام معلم</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      animation: fadeIn 0.8s ease-out;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 600;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 8px;
      font-weight: 500;
    }

    input, select, button {
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      outline: none;
      transition: background 0.3s ease;
    }

    input::placeholder, select {
      color: rgba(255, 255, 255, 0.7);
    }

    input:focus, select:focus {
      background: rgba(255, 255, 255, 0.3);
    }

    button {
      background: #2575fc;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #6a11cb;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
<div class="container">
  <h1>ثبت نام معلم</h1>
  <form id="studentForm">
    <label for="firstName">نام:</label>
    <input type="text" id="firstName" name="firstName" required>

    <label for="lastName">نام خانوادگی:</label>
    <input type="text" id="lastName" name="lastName" required>

    <label for="username">نام کاربری:</label>
    <input type="text" id="username" name="username" required>

    <label for="password">رمز عبور:</label>
    <input type="password" id="password" name="password" required>

    <label for="nationalCode">کد ملی:</label>
    <input type="text" id="nationalCode" name="nationalCode" required>

    <label for="dateOfBirth">تاریخ تولد:</label>
    <input type="date" id="dateOfBirth" name="dateOfBirth" required>

    <label for="phoneNumber">شماره تلفن:</label>
    <input type="text" id="phoneNumber" name="phoneNumber" required>

    <label for="email">ایمیل:</label>
    <input type="email" id="email" name="email" required>

    <button type="submit">ثبت نام</button>
  </form>
</div>

<script>
  document.getElementById('studentForm').addEventListener('submit', function (event) {
    event.preventDefault();

    const formData = {
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      nationalCode: document.getElementById('nationalCode').value,
      dateOfBirth: document.getElementById('dateOfBirth').value,
      phoneNumber: document.getElementById('phoneNumber').value,
      email: document.getElementById('email').value,

    };

    fetch('http://localhost:8080/teacher/register', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    })
            .then(response => response.json())
            .then(data => {
              console.log('Success:', data);
              alert('معلم با موفقیت ثبت شد!');
            })
            .catch(error => {
              console.error('Error:', error);
              alert('خطا در ثبت معلم!');
            });
  });
</script>
</body>
</html>
